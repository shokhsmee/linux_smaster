[project]
name = "guardian"
version = "0.1.0"
description = "Lightweight security manager for Linux servers: exposure, SSH, patches/KEV, leaked AI keys, persistence."
readme = "README.md"
requires-python = ">=3.15"
license = "AGPL-3.0-or-later"
authors = [{ name = "Shohjahon Obruyev" }]
dependencies = [
    "typer>=0.27.3",
    "rich>=15.0.0",
    "pydantic>=2.14.1",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "anthropic>=2.3.0",
]

[project.scripts]
guardian = "guardian.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
