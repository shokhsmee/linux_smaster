[project]
name = "guardian"
version = "0.1.0"
description = "Lightweight security manager for Linux servers: exposure, SSH, patches/KEV, leaked AI keys, persistence."
readme = "README.md"
requires-python = ">=3.15"
license = "AGPL-3.0-or-later"
authors = [{ name = "Shohjahon Obruyev" }]
dependencies = [
    "typer>=0.27.3",
    "rich>=15.0.0",
    "pydantic>=2.14.1",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "anthropic>=2.3.0",
]

[project.scripts]
guardian = "guardian.cli:app"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hypothesis>=6.170.12",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardian"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 200
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PIE", "RUF", "BLE"]
# E501: long regex/table lines are deliberate; E741: short loop names in parsers.
ignore = ["E501", "E741"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B404/B603: guardian.utils.run executes fixed argv lists without a shell; that is the intended safe form.
skips = ["B404", "B603"]
