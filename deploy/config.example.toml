# Copy to /etc/guardian/config.toml  (chmod 600). Every key is optional.

# state_dir = "/var/lib/guardian"

[exposure]
enabled = true
probe_http = true        # confirm AI/dev services answer without auth (local requests only)
probe_timeout = 2.0

[ssh]
enabled = true
auth_logs = ["/var/log/auth.log", "/var/log/secure"]
window_minutes = 60
brute_force_threshold = 50

[patches]
enabled = true
kev_cache_hours = 12
sla_days = 3             # BOD 26-04 style window for internet-exposed hosts

[secrets]
enabled = true
paths = ["/home", "/root", "/srv", "/opt", "/var/www", "/etc"]
max_file_kb = 512
scan_proc_environ = true

[persistence]
enabled = true
extra_paths = []         # extra directories to baseline, e.g. ["/opt/myapp/bin"]

[alerts]
min_severity = "medium"  # info | low | medium | high | critical
# Prefer the environment (/etc/guardian/env) for tokens:
#   GUARDIAN_TELEGRAM_TOKEN=...   GUARDIAN_TELEGRAM_CHAT=...
#   GUARDIAN_SLACK_WEBHOOK=...    GUARDIAN_WEBHOOK=...
telegram_bot_token = ""
telegram_chat_id = ""
slack_webhook = ""
generic_webhook = ""

# ---- Phase 2 modules ----

[process]
enabled = true
cpu_sample_seconds = 1.0  # how long to sample CPU per run
cpu_threshold = 85.0      # % CPU from an unpackaged binary that triggers a finding

[rootkit]
enabled = true
pid_probe_limit = 131072  # brute-force /proc/N up to this PID to find hidden processes
page_cache_check = true   # compare setuid binaries in page cache vs disk (Copy Fail)

[kernel]
enabled = true

[agents]
enabled = true
extra_roots = []          # extra directories that hold repos/agent configs, e.g. ["/srv/apps"]

[egress]
enabled = true
reverse_dns = true
dns_timeout = 1.0
scan_threshold = 15       # distinct hosts on admin ports from one process = worm behaviour
